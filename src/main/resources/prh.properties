# Mémoire de l'auto-apprentissage des recherches (tolérances, zones) : base SQLite partagée par les bots
# Fichier, par défaut ~/.ksuto/prh.db
#ksuto.prh.database.file=
# true : rien n'est conservé d'une exécution à l'autre (mémoire vive seulement)
ksuto.prh.database.offline=false

ksuto.prh.peripherals.delay=100

# WINDOWED | FULLSCREEN
ksuto.prh.peripherals.screen=FULLSCREEN

ksuto.prh.peripherals.mouse.drag.delay=10
ksuto.prh.peripherals.mouse.drag.space=5
ksuto.prh.peripherals.keyboard.typing.delay=50

# true | false
ksuto.prh.seeker.saveCaptureOnNotFound=false
